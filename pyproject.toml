[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pillow-scripts"
version = "13.0.0"
description = "Python Imaging Library (Fork) Scripts"
readme = "README.rst"
license = "MIT-CMU"
license-files = ["LICENSE"]
authors = [{ name = "Alex Clark (Fork Author)", email = "aclark@aclark.net" }]
keywords = ["Imaging"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
dependencies = ["Pillow"]

[project.urls]
Homepage = "https://github.com/python-pillow/pillow-scripts/"

[tool.setuptools]
# scripts only; don't auto-discover Scripts/ or presentation/ as packages
packages = []
script-files = [
    "Scripts/enhancer.py",
    "Scripts/explode.py",
    "Scripts/gifmaker.py",
    "Scripts/make_hash.py",
    "Scripts/painter.py",
    "Scripts/pilconvert.py",
    "Scripts/pildriver.py",
    "Scripts/pilfile.py",
    "Scripts/pilfont.py",
    "Scripts/pilprint.py",
    "Scripts/player.py",
    "Scripts/thresholder.py",
    "Scripts/viewer.py",
]
